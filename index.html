<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jack On Demand</title>
  <!-- Load Orbitron from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="home-page">

<div id="intro" class="intro-screen" data-fadepoint="360" data-debounce="120" data-show-threshold="false">
    <video id="intro-video" class="intro-video" autoplay muted playsinline preload="auto" poster="images/Background.jpg" aria-label="Intro video" tabindex="-1">
      <source src="https://media.jackondemand.nl/Jod-Intro.mp4" type="video/mp4">
      Your browser does not support the intro video.
    </video>
    <div id="video-fallback" class="video-fallback" aria-hidden="true">
      <button type="button" class="video-play-btn-start">Play intro with sound</button> 
    </div>

    <div class="video-controls" aria-label="Intro video controls">
      <input id="video-volume" class="video-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Intro video volume">
      <button id="video-mute" class="video-mute-btn" type="button" aria-pressed="false">Mute</button>
    </div>

    <div class="intro-center">
        <h1 class="intro-title">Jack On Demand</h1>
        <p class="intro-secondary">
          <a href="portfolio.html#sound-design">Sound Design</a> •
          <a href="portfolio.html#mixing">Mixing</a> •
          <a href="portfolio.html#composing">Composing</a> •
          <a href="portfolio.html#recording">Recording</a>
        </p>
    </div>
    <div class="intro-action-controls" aria-label="Intro video controls">
      <button id="intro-start" class="intro-action-btn">Start</button>
      <button id="intro-pause" class="intro-action-btn">Pause</button>
      <button id="intro-replay" class="intro-action-btn">Replay</button>
    </div>
  
</div>
  <!-- Top-right logo/menu toggle -->
  <button class="site-menu-toggle" aria-label="Open site menu" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="4" fill="white" fill-opacity="0.08" />
      <path d="M7 9h10M7 12h10M7 15h7" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    </svg>
  </button>

  <nav class="site-menu" aria-hidden="true">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html#all">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

    <footer class="footer">
      <p>© <span id="year"></span> Jack On Demand - Creating an otherworldly experience</p>
    </footer>
    

  <script src="script.js" defer></script>
  
</body>
</html>
